<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #09090b;
        --surface: #121215;
        --surface-hover: #18181b;
        --border: #27272a;
        --border-light: #3f3f46;
        --text: #fafafa;
        --muted: #a1a1aa;
        --accent: #10b981;
        --primary-bg: #fafafa;
        --primary-text: #09090b;
      }
      body.light {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-hover: #f1f5f9;
        --border: #e2e8f0;
        --border-light: #cbd5e1;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #059669;
        --primary-bg: #0f172a;
        --primary-text: #ffffff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 350px;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
        padding: 16px;
        user-select: none;
        transition:
          background 0.15s,
          color 0.15s;
      }
      svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        flex-shrink: 0;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 11px;
        border-bottom: 1px solid var(--border);
      }
      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand-icon {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: var(--surface);
        border: 1px solid var(--border-light);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
      }
      .brand {
        font-size: 14px;
        font-weight: 600;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .icon-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .icon-btn:hover {
        color: var(--text);
        border-color: var(--border-light);
      }

      #normalView {
        display: block;
      }
      #captureView {
        display: none;
        padding: 10px 4px;
        text-align: center;
      }

      .capture-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        font-weight: 600;
        font-size: 14px;
      }
      .doc-preview-box {
        width: 110px;
        height: 130px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        margin: 0 auto 16px;
        display: flex;
        flex-direction: column;
        padding: 12px;
        gap: 6px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        position: relative;
        overflow: hidden;
      }
      .doc-line {
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        width: 80%;
      }
      .doc-line.short {
        width: 40%;
      }
      .doc-box-inner {
        flex: 1;
        background: var(--bg);
        border-radius: 6px;
        margin-top: 4px;
      }

      .status-heading {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .progress-bar-wrap {
        width: 100%;
        height: 5px;
        background: var(--border);
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 10px;
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.15s ease;
      }
      .status-sub {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 24px;
      }

      .btn-stop {
        width: 100%;
        padding: 11px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        font-weight: 600;
        font-size: 13px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.12s;
      }
      .btn-stop:hover {
        background: var(--surface-hover);
        border-color: var(--border-light);
        color: #ef4444;
      }

      .section-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 7px;
        font-weight: 600;
      }
      .mode-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 14px;
      }
      .btn-mode {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 11px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--text);
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        transition: all 0.12s ease;
      }
      .btn-mode.full-span {
        grid-column: span 2;
        background: var(--primary-bg);
        color: var(--primary-text);
        border-color: var(--primary-bg);
        font-weight: 600;
      }
      .btn-mode-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-mode:hover {
        border-color: var(--border-light);
        transform: translateY(-1px);
      }
      .kbd {
        font-size: 10px;
        opacity: 0.7;
        font-family: ui-monospace, monospace;
      }
      .settings-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 4px 12px;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6.5px 0;
        font-size: 12px;
        border-bottom: 1px solid var(--border);
      }
      .row:last-child {
        border-bottom: none;
      }
      .row-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        cursor: pointer;
      }
      .row-label svg {
        color: var(--muted);
        width: 14px;
        height: 14px;
      }
      select {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 3px 7px;
        font-size: 11px;
        outline: none;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 32px;
        height: 18px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: var(--border-light);
        transition: 0.15s;
        border-radius: 99px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 12px;
        width: 12px;
        left: 3px;
        bottom: 3px;
        background-color: #fff;
        transition: 0.15s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background-color: var(--accent);
      }
      input:checked + .slider:before {
        transform: translateX(14px);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand-wrap">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
            />
            <circle cx="12" cy="13" r="4" />
          </svg>
        </div>
        <div class="brand">SnapMaster v5.4</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnOpenStudio" title="Open Studio">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
        </button>
        <button class="icon-btn" id="btnTheme" title="Toggle Light / Dark Mode">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        </button>
      </div>
    </div>

    <div id="normalView">
      <div class="section-title">Capture & Tools</div>
      <div class="mode-grid">
        <button id="btnFull" class="btn-mode full-span">
          <span class="btn-mode-left">
            <svg viewBox="0 0 24 24">
              <path
                d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
              />
              <line x1="12" y1="8" x2="12" y2="16" />
              <polyline points="8 12 12 16 16 12" />
            </svg>
            <span>Full Page Auto-Scroll</span>
          </span>
          <span class="kbd">Alt+Shift+F</span>
        </button>

        <button id="btnVisible" class="btn-mode">
          <span class="btn-mode-left">
            <svg viewBox="0 0 24 24">
              <rect x="2" y="3" width="20" height="14" rx="2" />
              <line x1="8" y1="21" x2="16" y2="21" />
              <line x1="12" y1="17" x2="12" y2="21" />
            </svg>
            <span>Visible View</span>
          </span>
        </button>

        <button id="btnRegion" class="btn-mode">
          <span class="btn-mode-left">
            <svg viewBox="0 0 24 24">
              <path d="M6 2v14a2 2 0 0 0 2 2h14" />
              <path d="M18 22V8a2 2 0 0 0-2-2H2" />
            </svg>
            <span>Crop Region</span>
          </span>
        </button>

        <button id="btnElement" class="btn-mode" style="grid-column: span 2">
          <span class="btn-mode-left">
            <svg viewBox="0 0 24 24">
              <polyline points="16 18 22 12 16 6" />
              <polyline points="8 6 2 12 8 18" />
            </svg>
            <span>Inspect & Capture HTML Element</span>
          </span>
          <span class="kbd">Hover & Click</span>
        </button>

        <button
          id="btnStyleInspect"
          class="btn-mode full-span"
          style="
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
          "
        >
          <span class="btn-mode-left">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
            <span>Live CSS & Style Inspector + Code Copy</span>
          </span>
        </button>
      </div>

      <div class="section-title">Preferences</div>
      <div class="settings-card">
        <div class="row">
          <label class="row-label" for="delaySelect">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
            <span>Delay Timer</span>
          </label>
          <select id="delaySelect">
            <option value="0">None (0s)</option>
            <option value="3">3 Seconds</option>
            <option value="5">5 Seconds</option>
            <option value="10">10 Seconds</option>
          </select>
        </div>

        <div class="row">
          <label class="row-label" for="speedSelect">
            <svg viewBox="0 0 24 24">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
            <span>Scroll Speed</span>
          </label>
          <select id="speedSelect">
            <option value="350">Fast (350ms)</option>
            <option value="550" selected>Standard (550ms)</option>
            <option value="950">Lazy-Load (950ms)</option>
          </select>
        </div>

        <div class="row">
          <label class="row-label" for="hideFixed">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <line x1="3" y1="9" x2="21" y2="9" />
            </svg>
            <span>Hide Sticky Headers</span>
          </label>
          <label class="switch"
            ><input type="checkbox" id="hideFixed" checked /><span
              class="slider"
            ></span
          ></label>
        </div>

        <div class="row">
          <label class="row-label" for="killCookies">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
            </svg>
            <span>Hide Cookie & GDPR Popups</span>
          </label>
          <label class="switch"
            ><input type="checkbox" id="killCookies" checked /><span
              class="slider"
            ></span
          ></label>
        </div>

        <div class="row">
          <label class="row-label" for="hideScroll">
            <svg viewBox="0 0 24 24">
              <rect x="8" y="3" width="8" height="18" rx="4" />
              <line x1="12" y1="7" x2="12" y2="11" />
            </svg>
            <span>Hide Scrollbars</span>
          </label>
          <label class="switch"
            ><input type="checkbox" id="hideScroll" checked /><span
              class="slider"
            ></span
          ></label>
        </div>

        <div class="row">
          <label class="row-label" for="forceDark">
            <svg viewBox="0 0 24 24">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <span>Force Dark Mode</span>
          </label>
          <label class="switch"
            ><input type="checkbox" id="forceDark" /><span
              class="slider"
            ></span
          ></label>
        </div>
      </div>
    </div>

    <div id="captureView">
      <div class="capture-title-row">
        <span style="display: flex; align-items: center; gap: 8px">
          <span
            style="
              width: 8px;
              height: 8px;
              border-radius: 50%;
              background: var(--accent);
              display: inline-block;
            "
          ></span>
          Capturing the page
        </span>
        <svg
          viewBox="0 0 24 24"
          style="width: 18px; height: 18px; color: var(--muted)"
        >
          <rect x="6" y="4" width="4" height="16" />
          <rect x="14" y="4" width="4" height="16" />
        </svg>
      </div>

      <div class="doc-preview-box">
        <div class="doc-line short"></div>
        <div class="doc-line"></div>
        <div class="doc-box-inner"></div>
      </div>

      <div class="status-heading" id="captureStatusText">Warming up</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="captureProgressBar"></div>
      </div>
      <div class="status-sub">capture keeps running — reopen to see progress</div>

      <button class="btn-stop" id="btnStopCapture">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
        Stop capture
      </button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      /* The popup draws its cards and hovers one step below Studio on the
         same scale, so only the role mapping differs here. */
      body {
        --card-bg: var(--surface-1);
        --hover-bg: var(--surface-2);
      }
      body.light {
        --hover-bg: var(--surface-3);
      }
      body {
        width: 350px;
        padding: 16px;
        user-select: none;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 11px;
        border-bottom: 1px solid var(--border);
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .row-label svg {
        color: var(--muted);
        width: 14px;
        height: 14px;
      }
      #normalView {
        display: block;
      }
      #captureView {
        display: none;
        padding: 10px 4px;
        text-align: center;
      }
      .mode-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 14px;
      }
      .kbd {
        font-size: 10px;
        opacity: 0.7;
        font-family: ui-monospace, monospace;
      }

      .capture-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        font-weight: 600;
        font-size: 14px;
      }
      .capture-title-row > svg {
        width: 18px;
        height: 18px;
        color: var(--muted);
      }
      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
        flex: none;
      }
      .doc-preview-box {
        width: 110px;
        height: 130px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        margin: 0 auto 16px;
        display: flex;
        flex-direction: column;
        padding: 12px;
        gap: 6px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        position: relative;
        overflow: hidden;
      }
      .doc-line {
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        width: 80%;
      }
      .doc-line.short {
        width: 40%;
      }
      .doc-box-inner {
        flex: 1;
        background: var(--bg);
        border-radius: 6px;
        margin-top: 4px;
      }
      .status-heading {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .progress-bar-wrap {
        width: 100%;
        height: 5px;
        background: var(--border);
        border-radius: var(--r-pill);
        overflow: hidden;
        margin-bottom: 10px;
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.15s ease;
      }
      .status-sub {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .btn-partial {
        width: 100%;
        margin-bottom: 10px;
        border-style: dashed;
        border-color: var(--border-light);
        color: var(--muted);
      }
      .btn-partial:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      .btn-partial-cta {
        color: var(--accent);
        font-weight: 700;
        font-size: 11px;
        white-space: nowrap;
        margin-left: auto;
      }
      .btn-stop {
        width: 100%;
        font-weight: 600;
      }
      .btn-stop:hover {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <div class="brand-tile">
          <svg viewBox="0 0 24 24">
            <path
              d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
            />
            <circle cx="12" cy="13" r="4" />
          </svg>
        </div>
        <span>Shotkit</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnOpenStudio" title="Open Studio">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
        </button>
        <button
          class="icon-btn"
          id="btnTheme"
          title="Switch to light mode"
          aria-label="Switch to light mode"
        >
          <svg class="theme-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <svg class="theme-moon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </div>

    <div id="normalView">
      <div class="section-title">Capture &amp; Tools</div>
      <div class="mode-grid">
        <button id="btnFull" class="btn spread primary span-2">
          <span class="row-label">
            <svg viewBox="0 0 24 24">
              <path
                d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
              />
              <line x1="12" y1="8" x2="12" y2="16" />
              <polyline points="8 12 12 16 16 12" />
            </svg>
            <span>Full Page Auto-Scroll</span>
          </span>
          <span class="kbd">Alt+Shift+F</span>
        </button>

        <button id="btnVisible" class="btn spread">
          <span class="row-label">
            <svg viewBox="0 0 24 24">
              <rect x="2" y="3" width="20" height="14" rx="2" />
              <line x1="8" y1="21" x2="16" y2="21" />
              <line x1="12" y1="17" x2="12" y2="21" />
            </svg>
            <span>Visible View</span>
          </span>
        </button>

        <button id="btnRegion" class="btn spread">
          <span class="row-label">
            <svg viewBox="0 0 24 24">
              <path d="M6 2v14a2 2 0 0 0 2 2h14" />
              <path d="M18 22V8a2 2 0 0 0-2-2H2" />
            </svg>
            <span>Crop Region</span>
          </span>
        </button>

        <button id="btnElement" class="btn spread span-2">
          <span class="row-label">
            <svg viewBox="0 0 24 24">
              <polyline points="16 18 22 12 16 6" />
              <polyline points="8 6 2 12 8 18" />
            </svg>
            <span>Inspect &amp; Capture HTML Element</span>
          </span>
          <span class="kbd">Hover &amp; Click</span>
        </button>

        <button id="btnStyleInspect" class="btn spread accent span-2">
          <span class="row-label">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
            <span>Live CSS &amp; Style Inspector + Code Copy</span>
          </span>
        </button>
      </div>

      <div class="section-title">Preferences</div>
      <div class="card rows">
        <div class="row">
          <label class="row-label" for="delaySelect">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
            <span>Delay Timer</span>
          </label>
          <select id="delaySelect">
            <option value="0">None (0s)</option>
            <option value="3">3 Seconds</option>
            <option value="5">5 Seconds</option>
            <option value="10">10 Seconds</option>
          </select>
        </div>

        <div class="row">
          <label class="row-label" for="speedSelect">
            <svg viewBox="0 0 24 24">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
            <span>Scroll Speed</span>
          </label>
          <select id="speedSelect">
            <option value="350">Fast (350ms)</option>
            <option value="550" selected>Standard (550ms)</option>
            <option value="950">Lazy-Load (950ms)</option>
          </select>
        </div>

        <div class="row">
          <label class="row-label" for="hideFixed">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <line x1="3" y1="9" x2="21" y2="9" />
            </svg>
            <span>Hide Sticky Headers</span>
          </label>
          <label class="switch"
            ><input type="checkbox" id="hideFixed" checked /><span
              class="slider"
            ></span
          ></label>
        </div>

        <div class="row">
          <label class="row-label" for="killCookies">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
            </svg>
            <span>Hide Cookie & GDPR Popups</span>
          </label>
          <label class="switch"
            ><input type="checkbox" id="killCookies" checked /><span
              class="slider"
            ></span
          ></label>
        </div>

        <div class="row">
          <label class="row-label" for="hideScroll">
            <svg viewBox="0 0 24 24">
              <rect x="8" y="3" width="8" height="18" rx="4" />
              <line x1="12" y1="7" x2="12" y2="11" />
            </svg>
            <span>Hide Scrollbars</span>
          </label>
          <label class="switch"
            ><input type="checkbox" id="hideScroll" checked /><span
              class="slider"
            ></span
          ></label>
        </div>

        <div class="row">
          <label class="row-label" for="forceDark">
            <svg viewBox="0 0 24 24">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <span>Force Dark Mode</span>
          </label>
          <label class="switch"
            ><input type="checkbox" id="forceDark" /><span
              class="slider"
            ></span
          ></label>
        </div>
      </div>
    </div>

    <div id="captureView">
      <div class="capture-title-row">
        <span class="row-label">
          <span class="live-dot"></span>
          Capturing the page
        </span>
        <svg viewBox="0 0 24 24">
          <rect x="6" y="4" width="4" height="16" />
          <rect x="14" y="4" width="4" height="16" />
        </svg>
      </div>

      <div class="doc-preview-box">
        <div class="doc-line short"></div>
        <div class="doc-line"></div>
        <div class="doc-box-inner"></div>
      </div>

      <div class="status-heading" id="captureStatusText">Idle</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="captureProgressBar"></div>
      </div>
      <div class="status-sub">
        capture keeps running — reopen to see progress
      </div>

      <button class="btn spread btn-partial" id="btnPartial">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M3 9h18" />
          <path d="M9 3v18" />
        </svg>
        <span>Only need part of the page?</span>
        <span class="btn-partial-cta">Switch to region</span>
      </button>

      <button class="btn btn-stop" id="btnStopCapture">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
        Stop capture
      </button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
